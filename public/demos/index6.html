<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=MonteCarlo&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes frameIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  @keyframes lineGrow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
  @keyframes leafDrift { 0% { transform: translate(0,0) rotate(var(--leaf-rot,0deg)); } 50% { transform: translate(4px,-16px) rotate(calc(var(--leaf-rot,0deg) + 9deg)); } 100% { transform: translate(0,0) rotate(var(--leaf-rot,0deg)); } }
  @keyframes leafDrift2 { 0% { transform: translate(0,0) rotate(var(--leaf-rot,0deg)); } 50% { transform: translate(-6px,-10px) rotate(calc(var(--leaf-rot,0deg) - 10deg)); } 100% { transform: translate(0,0) rotate(var(--leaf-rot,0deg)); } }
  a:hover { background-color: #542f20; }
  @media (prefers-reduced-motion: reduce) {
    .anim-heading, .anim-frame, .anim-art, .anim-divider, .anim-footer, .anim-cta {
      animation: none !important; opacity: 1 !important; transform: none !important;
    }
    .leaf { animation: none !important; }
  }
  @media (max-width: 640px) {
    .leaf { display: none; }
  }
</style>
</head>
<body>

<section style="box-sizing:border-box; position:relative; min-height:100dvh; width:100%; background:#f7e5db; display:flex; align-items:center; justify-content:center; padding:clamp(24px,6vw,64px) clamp(20px,5vw,40px); font-family:'DM Serif Text', serif; overflow:hidden;">

  <span class="leaf" style="--leaf-rot:-15deg; position:absolute; left:6%; top:12%; width:16px; height:22px; background:#8b3f27; opacity:0.35; border-radius:0% 60% 60% 60%; transform:rotate(-15deg); animation:leafDrift 7s ease-in-out infinite;"></span>
  <span class="leaf" style="--leaf-rot:22deg; position:absolute; left:2%; top:33%; width:10px; height:14px; background:#6e412e; opacity:0.22; border-radius:0% 60% 60% 60%; transform:rotate(22deg); animation:leafDrift2 6.4s ease-in-out infinite 0.9s;"></span>
  <span class="leaf" style="--leaf-rot:10deg; position:absolute; left:11%; top:47%; width:12px; height:17px; background:#6e412e; opacity:0.3; border-radius:0% 60% 60% 60%; transform:rotate(10deg); animation:leafDrift 8.5s ease-in-out infinite 1.2s;"></span>
  <span class="leaf" style="--leaf-rot:-26deg; position:absolute; left:7%; top:63%; width:9px; height:13px; background:#8b3f27; opacity:0.2; border-radius:0% 60% 60% 60%; transform:rotate(-26deg); animation:leafDrift2 9.8s ease-in-out infinite 2.1s;"></span>
  <span class="leaf" style="--leaf-rot:-8deg; position:absolute; left:4%; top:78%; width:14px; height:19px; background:#8b3f27; opacity:0.25; border-radius:0% 60% 60% 60%; transform:rotate(-8deg); animation:leafDrift 9s ease-in-out infinite 0.4s;"></span>
  <span class="leaf" style="--leaf-rot:18deg; position:absolute; left:13%; top:88%; width:11px; height:15px; background:#6e412e; opacity:0.24; border-radius:0% 60% 60% 60%; transform:rotate(18deg); animation:leafDrift2 7.6s ease-in-out infinite 1.6s;"></span>

  <span class="leaf" style="--leaf-rot:14deg; position:absolute; right:6%; top:18%; width:15px; height:20px; background:#6e412e; opacity:0.32; border-radius:0% 60% 60% 60%; transform:rotate(14deg); animation:leafDrift 7.8s ease-in-out infinite 0.8s;"></span>
  <span class="leaf" style="--leaf-rot:-20deg; position:absolute; right:2%; top:38%; width:10px; height:14px; background:#8b3f27; opacity:0.2; border-radius:0% 60% 60% 60%; transform:rotate(-20deg); animation:leafDrift2 8.8s ease-in-out infinite 0.2s;"></span>
  <span class="leaf" style="--leaf-rot:-12deg; position:absolute; right:10%; top:50%; width:13px; height:18px; background:#8b3f27; opacity:0.28; border-radius:0% 60% 60% 60%; transform:rotate(-12deg); animation:leafDrift 8s ease-in-out infinite 1.6s;"></span>
  <span class="leaf" style="--leaf-rot:24deg; position:absolute; right:4%; top:66%; width:9px; height:13px; background:#6e412e; opacity:0.22; border-radius:0% 60% 60% 60%; transform:rotate(24deg); animation:leafDrift2 6.9s ease-in-out infinite 1.1s;"></span>
  <span class="leaf" style="--leaf-rot:6deg; position:absolute; right:5%; top:80%; width:12px; height:16px; background:#6e412e; opacity:0.25; border-radius:0% 60% 60% 60%; transform:rotate(6deg); animation:leafDrift 9.4s ease-in-out infinite 0.3s;"></span>
  <span class="leaf" style="--leaf-rot:-16deg; position:absolute; right:12%; top:91%; width:11px; height:15px; background:#8b3f27; opacity:0.2; border-radius:0% 60% 60% 60%; transform:rotate(-16deg); animation:leafDrift2 10.2s ease-in-out infinite 0.6s;"></span>

  <div style="display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; max-width:640px; gap:clamp(18px,3vw,28px); position:relative; z-index:1;">

    <h1 class="anim-heading" style="margin:0; font-family:'MonteCarlo', cursive; font-weight:400; font-size:clamp(48px,9vw,88px); line-height:1; color:#8b3f27; opacity:0; animation:fadeUp 0.7s ease-out 0s forwards;">
      Save the Date
    </h1>

    <div class="anim-frame" style="opacity:0; animation:frameIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.18s forwards; border:3px solid #6e412e; border-radius:16px; padding:10px; width:100%;">
      <div style="border:1px solid #6e412e; border-radius:10px; overflow:hidden; width:100%; aspect-ratio:1535/672; background:#f7e5db;">
        <img class="anim-art" src="uploads/chapel.png" alt="Illustration of a Spanish-style chapel courtyard with palms and orange trees" style="display:block; width:100%; height:100%; object-fit:cover; mix-blend-mode:multiply; filter:sepia(0.35) saturate(1.3) hue-rotate(-6deg) brightness(0.98); opacity:0; animation:fadeUp 0.7s ease-out 0.36s forwards;" />
      </div>
    </div>

    <div class="anim-divider" style="display:flex; align-items:center; gap:10px; opacity:0; animation:lineGrow 0.6s ease-out 0.46s forwards; transform-origin:center;">
      <span style="width:clamp(28px,6vw,44px); height:1px; background:#6e412e;"></span>
      <span style="width:6px; height:6px; border-radius:50%; border:1px solid #6e412e;"></span>
      <span style="width:clamp(28px,6vw,44px); height:1px; background:#6e412e;"></span>
    </div>

    <p class="anim-footer" style="margin:0; opacity:0; animation:fadeUp 0.7s ease-out 0.56s forwards; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; font-size:clamp(11px,1.6vw,13px); letter-spacing:0.14em; text-transform:uppercase; color:#663c2c;">
      <span>Sara and Atef</span>
      <span style="opacity:0.5;">|</span>
      <span>27 &amp; 28 September 2026</span>
      <span style="opacity:0.5;">|</span>
      <span>Seville, Spain</span>
    </p>

    <a class="anim-cta" href="#rsvp" style="opacity:0; animation:fadeUp 0.7s ease-out 0.66s forwards; margin-top:4px; display:inline-block; background:#6e412e; color:#f7e5db; font-family:'DM Serif Text', serif; font-size:clamp(13px,1.8vw,15px); letter-spacing:0.12em; text-transform:uppercase; text-decoration:none; padding:14px 38px; border-radius:999px; transition:background-color 0.25s ease;">
      RSVP
    </a>

  </div>
</section>

</body>
</html>
