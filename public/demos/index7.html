<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=MonteCarlo&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes lineGrow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes flap { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.45); } }
    @keyframes fly1 { 0% { transform: translate(0,0) rotate(-4deg); } 25% { transform: translate(60px,-40px) rotate(3deg); } 50% { transform: translate(20px,-90px) rotate(-3deg); } 75% { transform: translate(-50px,-50px) rotate(4deg); } 100% { transform: translate(0,0) rotate(-4deg); } }
    @keyframes fly2 { 0% { transform: translate(0,0) rotate(4deg); } 30% { transform: translate(-70px,-30px) rotate(-3deg); } 60% { transform: translate(-30px,-80px) rotate(3deg); } 100% { transform: translate(0,0) rotate(4deg); } }
    @keyframes petalFall { 0% { transform: translate(0,0) rotate(0deg); opacity:0; } 8% { opacity:0.75; } 92% { opacity:0.6; } 100% { transform: translate(var(--drift,20px), 100vh) rotate(340deg); opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .anim-heading, .anim-frame, .anim-art, .anim-divider, .anim-footer, .anim-cta { animation: none !important; opacity: 1 !important; transform: none !important; }
      .butterfly, .wing-flap, .petal { animation: none !important; }
    }
    @media (max-width: 640px) {
      .petal, .butterfly { display: none; }
    }
  </style>
</helmet>

<section style="box-sizing:border-box; position:relative; min-height:100dvh; width:100%; overflow:hidden; font-family:'DM Serif Text', serif; background:#f7e5db;">

  <div style="position:absolute; inset:0; z-index:0; overflow:hidden;">
    <img src="uploads/chapel.png" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(6px) sepia(0.35) saturate(1.3) hue-rotate(-6deg) brightness(0.94); transform:scale(1.05);" />
    <img src="uploads/chapel.png" alt="Illustration of a Spanish-style chapel courtyard with palms and orange trees" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:sepia(0.35) saturate(1.3) hue-rotate(-6deg) brightness(0.96); -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 30%, transparent 52%); mask-image:radial-gradient(circle at 50% 38%, #000 30%, transparent 52%);" />
    <div style="position:absolute; inset:0; background:radial-gradient(circle at 50% 38%, transparent 0%, transparent 28%, rgba(247,229,219,0.5) 50%, rgba(247,229,219,0.92) 70%);"></div>
  </div>

  <span class="petal" style="--drift:30px; position:absolute; left:8%; top:-6%; width:10px; height:14px; background:#c97b5a; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 11s linear infinite 0.5s; z-index:2;"></span>
  <span class="petal" style="--drift:-24px; position:absolute; left:18%; top:-8%; width:8px; height:11px; background:#d98a6b; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 9s linear infinite 2.3s; z-index:2;"></span>
  <span class="petal" style="--drift:18px; position:absolute; left:30%; top:-5%; width:9px; height:13px; background:#8b3f27; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 13s linear infinite 1.1s; z-index:2;"></span>
  <span class="petal" style="--drift:-32px; position:absolute; left:66%; top:-7%; width:9px; height:12px; background:#c97b5a; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 10s linear infinite 3.4s; z-index:2;"></span>
  <span class="petal" style="--drift:26px; position:absolute; left:78%; top:-4%; width:11px; height:15px; background:#d98a6b; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 12s linear infinite 0.2s; z-index:2;"></span>
  <span class="petal" style="--drift:-16px; position:absolute; left:90%; top:-6%; width:8px; height:11px; background:#8b3f27; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 9.5s linear infinite 2.8s; z-index:2;"></span>
  <span class="petal" style="--drift:20px; position:absolute; left:48%; top:-9%; width:9px; height:12px; background:#c97b5a; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 11.5s linear infinite 4.1s; z-index:2;"></span>
  <span class="petal" style="--drift:-20px; position:absolute; left:56%; top:-5%; width:7px; height:10px; background:#d98a6b; opacity:0; border-radius:0% 60% 60% 60%; animation:petalFall 8.5s linear infinite 1.7s; z-index:2;"></span>

  <div style="position:fixed; inset:16px; border:3px solid #6e412e; border-radius:20px; pointer-events:none; z-index:5;"></div>
  <div style="position:fixed; inset:26px; border:1px solid #6e412e; border-radius:14px; pointer-events:none; z-index:5;"></div>

  <div style="position:relative; z-index:3; box-sizing:border-box; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(16px,3vw,28px); padding:clamp(48px,8vw,72px) clamp(20px,5vw,40px);">

    <div class="anim-heading" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 22px; border-radius:14px; background:rgba(247,229,219,0.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; animation:fadeUp 0.7s ease-out 0s forwards;">
      <span style="font-family:'MonteCarlo', cursive; font-weight:400; font-size:clamp(24px,3.4vw,32px); color:#8b3f27;">Sara &amp; Atef</span>
      <span style="max-width:420px; font-family:'DM Serif Text', serif; font-style:italic; font-size:clamp(14px,1.8vw,16px); letter-spacing:0.03em; color:#4a2a1c;">We look forward welcoming you</span>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; max-width:560px; gap:clamp(14px,2.4vw,22px); background:rgba(247,229,219,0.82); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); border:1px solid rgba(255,255,255,0.6); box-shadow:0 8px 32px rgba(110,65,46,0.15); border-radius:20px; padding:clamp(22px,4vw,36px) clamp(20px,4vw,32px);">

      <h1 class="anim-heading" style="margin:0; font-family:'MonteCarlo', cursive; font-weight:400; font-size:clamp(44px,8vw,72px); line-height:1; color:#8b3f27; opacity:0; animation:fadeUp 0.7s ease-out 0s forwards;">
        Save the Date
      </h1>

      <div class="anim-divider" style="display:flex; align-items:center; gap:10px; opacity:0; animation:lineGrow 0.6s ease-out 0.3s forwards; transform-origin:center;">
        <span style="width:clamp(28px,6vw,44px); height:1px; background:#6e412e;"></span>
        <span style="width:6px; height:6px; border-radius:50%; border:1px solid #6e412e;"></span>
        <span style="width:clamp(28px,6vw,44px); height:1px; background:#6e412e;"></span>
      </div>

      <p class="anim-footer" style="margin:0; opacity:0; animation:fadeUp 0.7s ease-out 0.4s forwards; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; font-size:clamp(11px,1.6vw,13px); letter-spacing:0.14em; text-transform:uppercase; color:#663c2c;">
        <span>Sara and Atef</span>
        <span style="opacity:0.5;">|</span>
        <span>27 &amp; 28 September 2026</span>
        <span style="opacity:0.5;">|</span>
        <span>Seville, Spain</span>
      </p>

      <sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
        <a class="anim-cta" href="#rsvp" style="opacity:0; animation:fadeUp 0.7s ease-out 0.5s forwards; margin-top:2px; display:inline-block; background:#6e412e; color:#f7e5db; font-family:'DM Serif Text', serif; font-size:clamp(13px,1.8vw,15px); letter-spacing:0.12em; text-transform:uppercase; text-decoration:none; padding:14px 38px; border-radius:999px; transition:background-color 0.25s ease;" style-hover="background-color:#542f20;">
          RSVP
        </a>
      </sc-if>

    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showCta&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}}"></script>
</body>
</html>
